[project]
name = "luminote"
version = "0.1.0"
description = "A local activation-derived affective weather experiment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "torch>=2.6",
  "transformers>=4.48,<5",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "psd-tools>=1.10,<2"]
# Only for scripts/draft_reaction_descriptions.py, which sends reaction images to the Anthropic API.
draft = ["anthropic>=1.8,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["luminote*"]
